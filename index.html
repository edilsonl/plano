<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Gerenciamento de Módulos e Planos</title>
    <link rel="shortcut icon" href="https://avaprogep.ufma.br/pluginfile.php/1/core_admin/favicon/64x64/1784758307/PNG%20-%20Logo%20UFMA%20colorido%20%282%29.png" />

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
        }

        body {
            position: fixed;
            inset: 0;
        }

        iframe {
            display: block;
            width: 100vw;
            height: 100dvh;
            border: 0;
        }

        /* Loading Overlay Moderno */
        #loading {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #loading.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 3rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 90%;
            width: 420px;
        }

        /* Spinner Duplo Elegante */
        .spinner-container {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .spinner {
            position: absolute;
            inset: 0;
            border: 4px solid transparent;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .spinner::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 4px solid transparent;
            border-bottom-color: #38bdf8;
            border-radius: 50%;
            animation: spin-reverse 0.7s linear infinite;
        }

        .loading-text {
            margin-top: 1.25rem;
            font-size: 1.05rem;
            color: #1e293b;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .loading-subtext {
            margin-top: 0.3rem;
            font-size: 0.825rem;
            color: #64748b;
            line-height: 1.4;
        }

        /* Opção de escape caso ocorra bloqueio de permissão/X-Frame-Options */
        .fallback-container {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
            width: 100%;
        }

        .fallback-link {
            font-size: 0.825rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .fallback-link:hover {
            text-decoration: underline;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>

<body>

<div id="loading">
    <div class="loading-card">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <div class="loading-text">Carregando sistema</div>
        <div class="loading-subtext">Isso pode levar alguns segundos na primeira inicialização...</div>
        
        <div class="fallback-container">
            <div class="loading-subtext" style="margin-bottom: 6px;">Caso ocorra bloqueio de acesso ou tela em branco:</div>
            <a href="https://script.google.com/a/macros/ufma.br/s/AKfycbzo2muxCjmQoSsVNBmQZ7dhae63G1tttzO9eDJm5a_i_ztlEijddhFiu-_M_h39fZE/exec" target="_blank" class="fallback-link">
                Abrir sistema diretamente em nova aba &rarr;
            </a>
        </div>
    </div>
</div>

<iframe
    id="appFrame"
    src="https://script.google.com/a/macros/ufma.br/s/AKfycbzo2muxCjmQoSsVNBmQZ7dhae63G1tttzO9eDJm5a_i_ztlEijddhFiu-_M_h39fZE/exec"
    loading="eager">
</iframe>

<script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    let loadingHidden = false;

    function hideLoading() {
        if (loadingHidden) return;

        loadingHidden = true;
        loading.classList.add("fade-out");

        setTimeout(() => {
            if(loading.parentNode) {
                loading.remove();
            }
        }, 500);
    }

    // Oculta o overlay assim que o iframe dispara o evento de load
    frame.addEventListener("load", hideLoading);

    // Timeout de segurança para conexões lentas (25 segundos)
    setTimeout(hideLoading, 25000);
</script>

</body>
</html>
