<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Gerenciamento de Módulos e Planos</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            width:100%;
            height:100%;
            overflow:hidden;
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f5f5;
        }

        body{
            position:fixed;
            inset:0;
        }

        iframe{
            display:block;
            width:100vw;
            height:100dvh;
            border:0;
        }

        /* Loading */

        #loading{
            position:fixed;
            inset:0;
            width:100vw;
            height:100dvh;
            background:#fff;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            transition:opacity .4s ease, visibility .4s ease;
        }

        #loading.fade-out{
            opacity:0;
            visibility:hidden;
        }

        .spinner{
            width:60px;
            height:60px;
            border:6px solid #E5E7EB;
            border-top-color:#1976D2;
            border-radius:50%;
            animation:spin .8s linear infinite;
        }

        .loading-text{
            margin-top:18px;
            font-size:18px;
            color:#555;
            font-weight:500;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Carregando sistema...</div>
</div>

<iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwNIAi0c7v3TOduuB2Ssxi5-bQaynATYrx86ikAnYWMdvCKaMCSCvpkkvTy53LqtbgK/exec"
    loading="eager">
</iframe>

<script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    let loadingHidden = false;

    function hideLoading() {
        if (loadingHidden) return;

        loadingHidden = true;
        loading.classList.add("fade-out");

        setTimeout(() => {
            loading.remove();
        }, 400);
    }

    frame.addEventListener("load", hideLoading);

    // Fallback caso o evento load não seja disparado
    setTimeout(hideLoading, 15000);
</script>

</body>
</html>
