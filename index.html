<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Gerenciamento de Módulos e Planos</title>
    <link rel="shortcut icon" href="https://avaprogep.ufma.br/pluginfile.php/1/core_admin/favicon/64x64/1784758307/PNG%20-%20Logo%20UFMA%20colorido%20%282%29.png" />

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
        }

        body {
            position: fixed;
            inset: 0;
        }

        iframe {
            display: block;
            width: 100vw;
            height: 100dvh;
            border: 0;
        }

        /* Overlay Principal - Ele nunca some se der erro, escondendo a tela feia do navegador */
        #loading-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #loading-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Estilo dos Cards */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 3rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 90%;
            width: 420px;
        }

        /* Spinner Duplo */
        .spinner-container {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .spinner {
            position: absolute;
            inset: 0;
            border: 4px solid transparent;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .spinner::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 4px solid transparent;
            border-bottom-color: #38bdf8;
            border-radius: 50%;
            animation: spin-reverse 0.7s linear infinite;
        }

        .title {
            margin-top: 1.25rem;
            font-size: 1.1rem;
            color: #1e293b;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 0.4rem;
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.4;
        }

        /* Card de Acesso Negado / Seleção de Conta */
        #error-card {
            display: none;
        }

        .error-icon {
            width: 56px;
            height: 56px;
            color: #2563eb;
            margin-bottom: 0.25rem;
        }

        .btn-action {
            margin-top: 1.5rem;
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-action:hover {
            background: #1d4ed8;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    </style>
</head>

<body>

<div id="loading-overlay">
    <!-- Card de Carregamento -->
    <div class="card" id="loading-card">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <div class="title">Carregando sistema</div>
        <div class="subtitle">Verificando credenciais institucionais...</div>
    </div>

    <!-- Card de Autenticação / Escolha de Perfil -->
    <div class="card" id="error-card">
        <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        <div class="title">Selecione seu Perfil</div>
        <div class="subtitle">O sistema detectou um bloqueio de acesso. Clique abaixo para escolher sua conta institucional (@ufma.br).</div>
        
        <!-- O Segredo: URL do AccountChooser apontando para o seu Script -->
        <a href="https://accounts.google.com/AccountChooser?continue=https://script.google.com/a/macros/ufma.br/s/AKfycbz5gAYnKBhLFNQCsvIM3HVNkw4A5JBSj1EbEKckVg05Za4fUWxvyALGUTLOw_TkKZN1/exec" target="_blank" class="btn-action">
            Escolher Conta UFMA
        </a>
    </div>
</div>

<iframe
    id="appFrame"
    src="https://script.google.com/a/macros/ufma.br/s/AKfycbz5gAYnKBhLFNQCsvIM3HVNkw4A5JBSj1EbEKckVg05Za4fUWxvyALGUTLOw_TkKZN1/exec"
    loading="eager">
</iframe>

<script>
    const frame = document.getElementById("appFrame");
    const overlay = document.getElementById("loading-overlay");
    const loadingCard = document.getElementById("loading-card");
    const errorCard = document.getElementById("error-card");

    let isAppLoaded = false;

    // 1. Ouve o sinal de sucesso do Google Apps Script
    window.addEventListener("message", (event) => {
        if (event.data === "APP_LOADED_SUCCESS") {
            isAppLoaded = true;
            // Só esconde o overlay se o app realmente carregou, garantindo que o 
            // erro "conexão recusada" do navegador nunca seja visto pelo usuário.
            overlay.classList.add("fade-out");
            setTimeout(() => { if(overlay.parentNode) overlay.remove(); }, 500);
        }
    });

    // 2. O evento 'load' do iframe dispara mesmo se o Google bloquear o iframe.
    // Damos 1.5s de tolerância. Se o 'postMessage' não chegou nesse tempo, 
    // sabemos com 100% de certeza que o Google barrou o usuário na tela de login.
    frame.addEventListener("load", () => {
        setTimeout(() => {
            if (!isAppLoaded) {
                loadingCard.style.display = "none";
                errorCard.style.display = "flex";
            }
        }, 1500);
    });

    // Fallback de segurança se a internet estiver muito lenta
    setTimeout(() => {
        if (!isAppLoaded) {
            loadingCard.style.display = "none";
            errorCard.style.display = "flex";
        }
    }, 15000);
</script>

</body>
</html>
