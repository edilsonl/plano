<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Módulos e Planos</title>

    <style>
    /* Tela de Loading */
    #loading {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #f8fafc, #eef2ff);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity .5s ease, visibility .5s ease;
    }

    #loading.fade-out {
        opacity: 0;
        visibility: hidden;
    }

    .loading-card {
        width: 340px;
        background: rgba(255,255,255,.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 20px;
        padding: 35px 30px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,.08);
    }

    .loader {
        width: 54px;
        height: 54px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 4px solid #dbeafe;
        border-top-color: #2563eb;
        animation: spin .8s linear infinite;
    }

    h2 {
        font-size: 22px;
        color: #1f2937;
        font-weight: 600;
        margin-bottom: 8px;
    }

    p {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .progress {
        width: 100%;
        height: 6px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
    }

    .progress::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        animation: progress 1.5s ease-in-out infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes progress {
        0% {
            transform: translateX(-120%);
        }
        100% {
            transform: translateX(320%);
        }
    }
</style>
</head>
<body>

<div id="loading">
    <div class="loading-card">
        <div class="loader"></div>

        <h2>Carregando...</h2>

        <p>
            Aguarde enquanto preparamos o ambiente.
        </p>

        <div class="progress"></div>
    </div>
</div>

    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwNIAi0c7v3TOduuB2Ssxi5-bQaynATYrx86ikAnYWMdvCKaMCSCvpkkvTy53LqtbgK/exec"
        loading="eager">
    </iframe>

    <script>
        const frame = document.getElementById("appFrame");
        const loading = document.getElementById("loading");

        frame.addEventListener("load", () => {
            loading.classList.add("fade-out");

            setTimeout(() => {
                loading.style.display = "none";
            }, 400);
        });

        // Evita que o loading fique preso caso ocorra algum problema
        setTimeout(() => {
            loading.classList.add("fade-out");
            setTimeout(() => {
                loading.style.display = "none";
            }, 400);
        }, 15000);
    </script>

</body>
</html>
